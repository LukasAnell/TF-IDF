[project]
name = "tf-idf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LukasAnell", email = "lukasmanell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
tf-idf = "tf_idf:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
]

[tool.pyright]
reportMissingTypeStubs = "none"
